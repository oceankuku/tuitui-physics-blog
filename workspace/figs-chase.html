<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #fff; }
  .stage { display: flex; flex-direction: column; gap: 40px; padding: 20px; }
</style>
</head>
<body>
<div class="stage">

<!-- 2018 全国Ⅱ卷 T19：甲乙两车 v-t 图像，t2 时刻并排 -->
<svg id="fig-vt-2018" xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrBr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- 坐标轴 -->
  <line x1="130" y1="540" x2="910" y2="540" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arrB)"/>
  <line x1="130" y1="540" x2="130" y2="70" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="930" y="548" font-size="26" font-style="italic" fill="#1a1a1a">t</text>
  <text x="95" y="80" font-size="26" font-style="italic" fill="#1a1a1a">v</text>

  <!-- 面积块：t1~交点 乙在上（乙多走），交点~t2 甲在上（甲多走） -->
  <!-- 乙曲线（红线）：先缓后陡再缓，t1 前在甲上方，交叉后在甲下方 -->
  <!-- 甲曲线（蓝线）：先陡后缓再陡，t1 前在乙下方，交叉后在乙上方 -->
  <path d="M 130,340 C 220,300 300,240 400,225 C 520,208 620,215 720,255 C 790,283 850,320 890,345"
        fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <path d="M 130,470 C 200,430 260,360 360,330 C 500,290 640,240 760,225 C 820,218 870,215 895,214"
        fill="none" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/>

  <!-- 两线交点（约 x=508, y=237）与 t1、t2 竖直虚线 -->
  <line x1="262" y1="540" x2="262" y2="285" stroke="#90a4ae" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="812" y1="540" x2="812" y2="232" stroke="#90a4ae" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- t1、t2 标签 -->
  <text x="248" y="582" font-size="26" font-style="italic" fill="#1a1a1a">t<tspan baseline-shift="sub" font-size="18">1</tspan></text>
  <text x="798" y="582" font-size="26" font-style="italic" fill="#1a1a1a">t<tspan baseline-shift="sub" font-size="18">2</tspan></text>

  <!-- 曲线标签 -->
  <text x="875" y="195" font-size="26" fill="#1565c0" font-weight="bold">甲</text>
  <text x="900" y="365" font-size="26" fill="#c0392b" font-weight="bold">乙</text>

  <!-- 交点小圆 -->
  <circle cx="508" cy="238" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <text x="488" y="205" font-size="20" fill="#607d8b">图线交叉</text>

  <!-- t1 时刻标注：t1 在左，两条线之间竖向差距 -->
  <line x1="262" y1="296" x2="262" y2="405" stroke="#e67e22" stroke-width="3" marker-start="url(#arrBr)" marker-end="url(#arrBr)"/>
  <text x="180" y="262" font-size="22" fill="#e67e22">t₁ 时乙快</text>

  <!-- 交叉点后 t2 附近：甲在乙上方 -->
  <line x1="812" y1="227" x2="812" y2="258" stroke="#7b1fa2" stroke-width="3" marker-start="url(#arrBr)" marker-end="url(#arrBr)"/>
  <text x="640" y="320" font-size="22" fill="#7b1fa2">交叉后甲快</text>

  <!-- 底部说明 -->
  <text x="130" y="635" font-size="21" fill="#546e7a">两线在 t₁ 与 t₂ 之间交叉一次：交叉前乙的面积大，交叉后甲在追面积</text>
</svg>

</div>
</body>
</html>
